[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wids-lstm"
version = "0.1.0"
description = "LSTM-based wireless intrusion detection (deauthentication floods)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "scapy", "joblib", "tensorflow-cpu"]

[project.scripts]
wids = "wids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
